name: Validate and Release Skill

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: validate-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      release_intent: ${{ steps.release_intent.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release intent
        id: release_intent
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          publish="$(python3 tools/release_intent.py --event "$EVENT_NAME" --before "$BEFORE_SHA")"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Validate Skill source
        run: python3 tools/validate_skill.py skill

      - name: Test Phase 2 contract compatibility
        run: python3 tests/test_contract_check_phase2.py

      - name: Test repository preflight helper
        run: python3 tests/test_repo_preflight.py

      - name: Test Phase 6 deterministic lint
        run: python3 tests/test_validate_skill_phase6.py

      - name: Check immutable v1.2.2 runtime equivalence
        run: python3 tools/check_runtime_equivalence.py --repo-root .

      - name: Score Phase 7 operational benchmark
        run: |
          python3 tools/score_phase7_benchmark.py \
            --scenarios benchmarks/phase7/scenarios.json \
            --baseline benchmarks/phase7/traces-v1.0.0.json \
            --current benchmarks/phase7/traces-current.json \
            --repo-root . \
            --baseline-ref v1.0.0

      - name: Validate v1.2.2 representation baseline traces
        run: |
          python3 tools/score_phase7_benchmark.py \
            --comparison-mode validate-baseline \
            --scenarios benchmarks/phase7/scenarios.json \
            --baseline benchmarks/phase7/traces-v1.2.2.json \
            --repo-root .

      - name: Test Phase 7 benchmark scorer
        run: python3 tests/test_phase7_benchmark.py

      - name: Test runtime equivalence gate
        run: python3 tests/test_runtime_equivalence.py

      - name: Test runtime representation prototypes
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_runtime_*_experiment.py; do
            echo "==> $test"
            python3 "$test"
          done

      - name: Test auditable model trial runner
        run: python3 tests/test_run_model_trials.py

      - name: Test observable model trial scorer
        run: python3 tests/test_model_trial_scorer.py

      - name: Test release intent decisions
        run: python3 tests/test_release_intent.py

      - name: Test deterministic release packaging
        run: python3 tests/test_package_skill.py

      - name: Test deterministic platform packaging
        run: python3 tests/test_package_platform_skills.py

      - name: Test exact release publisher
        run: python3 tests/test_publish_release.py

      - name: Build candidate packages
        run: |
          python3 tools/package_skill.py skill skill.zip skill.zip.sha256
          python3 tools/package_platform_skills.py skill manus github-project-orchestrator-manus.zip github-project-orchestrator-manus.zip.sha256
          python3 tools/package_platform_skills.py skill qwen github-project-orchestrator-qwen.zip github-project-orchestrator-qwen.zip.sha256
          python3 tools/package_platform_skills.py skill claude github-project-orchestrator-claude.zip github-project-orchestrator-claude.zip.sha256

      - name: Verify immutable v1.0.0 baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d)"
          trap 'rm -rf "$baseline_dir"' EXIT
          git archive --format=tar v1.0.0 skill | tar -xf - -C "$baseline_dir"
          python3 tools/validate_skill.py "$baseline_dir/skill" \
            --baseline-manifest "$GITHUB_WORKSPACE/tests/baseline/v1.0.0.sha256"

      - name: Verify clean runtime source
        shell: bash
        run: |
          set -euo pipefail
          if find skill -type d -name __pycache__ -print -quit | grep -q .; then
            echo "Runtime source contains __pycache__" >&2
            exit 1
          fi
          if find skill -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo "Runtime source contains compiled Python artifacts" >&2
            exit 1
          fi

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.outputs.release_intent == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release assets
        run: |
          python3 tools/package_skill.py skill skill.zip skill.zip.sha256
          python3 tools/package_platform_skills.py skill manus github-project-orchestrator-manus.zip github-project-orchestrator-manus.zip.sha256
          python3 tools/package_platform_skills.py skill qwen github-project-orchestrator-qwen.zip github-project-orchestrator-qwen.zip.sha256
          python3 tools/package_platform_skills.py skill claude github-project-orchestrator-claude.zip github-project-orchestrator-claude.zip.sha256

      - name: Publish exact version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish_release.py
