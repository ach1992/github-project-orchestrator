name: Validate and Release Skill

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Skill source
        run: python3 tools/validate_skill.py skill

      - name: Test Phase 2 contract compatibility
        run: python3 tests/test_contract_check_phase2.py

      - name: Test Phase 6 deterministic lint
        run: python3 tests/test_validate_skill_phase6.py

      - name: Score Phase 7 operational benchmark
        run: |
          python3 tools/score_phase7_benchmark.py \
            --scenarios benchmarks/phase7/scenarios.json \
            --baseline benchmarks/phase7/traces-v1.0.0.json \
            --current benchmarks/phase7/traces-current.json \
            --repo-root . \
            --baseline-ref v1.0.0

      - name: Test Phase 7 benchmark scorer
        run: python3 tests/test_phase7_benchmark.py

      - name: Test deterministic release packaging
        run: python3 tests/test_package_skill.py

      - name: Build candidate package
        run: python3 tools/package_skill.py skill skill.zip skill.zip.sha256

      - name: Verify immutable v1.0.0 baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d)"
          trap 'rm -rf "$baseline_dir"' EXIT
          git archive --format=tar v1.0.0 skill | tar -xf - -C "$baseline_dir"
          python3 tools/validate_skill.py "$baseline_dir/skill" \
            --baseline-manifest "$GITHUB_WORKSPACE/tests/baseline/v1.0.0.sha256"

      - name: Verify clean runtime source
        shell: bash
        run: |
          set -euo pipefail
          if find skill -type d -name __pycache__ -print -quit | grep -q .; then
            echo "Runtime source contains __pycache__" >&2
            exit 1
          fi
          if find skill -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo "Runtime source contains compiled Python artifacts" >&2
            exit 1
          fi

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build skill.zip
        run: python3 tools/package_skill.py skill skill.zip skill.zip.sha256

      - name: Publish version if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
            echo "Release $TAG already exists at $EXISTING_SHA; current main is $GITHUB_SHA. VERSION was not bumped, so nothing is published."
            exit 0
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$TAG" skill.zip skill.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Release $TAG of GitHub Project Orchestrator. See CHANGELOG.md for release details." \
            "${prerelease_args[@]}"
