name: Validate and Release Skill

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: validate-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      release_intent: ${{ steps.release_intent.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release intent
        id: release_intent
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          publish="$(python3 tools/release_intent.py --event "$EVENT_NAME" --before "$BEFORE_SHA")"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Validate Skill structure and traceability
        run: python3 tools/validate_skill.py skill

      - name: Validate runtime budget and canonical rules
        run: python3 tests/test_runtime_semantics_v2.py

      - name: Test repository safety helper
        run: python3 tests/test_repo_preflight.py

      - name: Test release and packaging tooling
        run: |
          python3 tests/test_release_intent.py
          python3 tests/test_package_skill.py
          python3 tests/test_package_platform_skills.py
          python3 tests/test_publish_release.py

      - name: Build and validate exact candidate packages
        run: |
          python3 tools/package_skill.py skill skill.zip skill.zip.sha256
          python3 tools/package_platform_skills.py skill manus github-project-orchestrator-manus.zip github-project-orchestrator-manus.zip.sha256
          python3 tools/package_platform_skills.py skill qwen github-project-orchestrator-qwen.zip github-project-orchestrator-qwen.zip.sha256
          python3 tools/package_platform_skills.py skill claude github-project-orchestrator-claude.zip github-project-orchestrator-claude.zip.sha256
          python3 tools/package_platform_skills.py skill zcode github-project-orchestrator-zcode.zip github-project-orchestrator-zcode.zip.sha256
          python3 tools/package_platform_skills.py skill grok github-project-orchestrator-grok.zip github-project-orchestrator-grok.zip.sha256
          python3 tools/package_platform_skills.py skill kimi github-project-orchestrator-kimi.zip github-project-orchestrator-kimi.zip.sha256
          python3 tools/package_platform_skills.py skill gemini github-project-orchestrator-gemini.zip github-project-orchestrator-gemini.zip.sha256
          python3 tools/package_platform_skills.py skill deepseek github-project-orchestrator-deepseek.zip github-project-orchestrator-deepseek.zip.sha256
          python3 tools/package_platform_skills.py skill copilot github-project-orchestrator-copilot.zip github-project-orchestrator-copilot.zip.sha256

      - name: Verify clean runtime source
        shell: bash
        run: |
          set -euo pipefail
          if find skill -type d -name __pycache__ -print -quit | grep -q .; then
            echo "Runtime source contains __pycache__" >&2
            exit 1
          fi
          if find skill -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo "Runtime source contains compiled Python artifacts" >&2
            exit 1
          fi

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.outputs.release_intent == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release assets
        run: |
          python3 tools/package_skill.py skill skill.zip skill.zip.sha256
          python3 tools/package_platform_skills.py skill manus github-project-orchestrator-manus.zip github-project-orchestrator-manus.zip.sha256
          python3 tools/package_platform_skills.py skill qwen github-project-orchestrator-qwen.zip github-project-orchestrator-qwen.zip.sha256
          python3 tools/package_platform_skills.py skill claude github-project-orchestrator-claude.zip github-project-orchestrator-claude.zip.sha256
          python3 tools/package_platform_skills.py skill zcode github-project-orchestrator-zcode.zip github-project-orchestrator-zcode.zip.sha256
          python3 tools/package_platform_skills.py skill grok github-project-orchestrator-grok.zip github-project-orchestrator-grok.zip.sha256
          python3 tools/package_platform_skills.py skill kimi github-project-orchestrator-kimi.zip github-project-orchestrator-kimi.zip.sha256
          python3 tools/package_platform_skills.py skill gemini github-project-orchestrator-gemini.zip github-project-orchestrator-gemini.zip.sha256
          python3 tools/package_platform_skills.py skill deepseek github-project-orchestrator-deepseek.zip github-project-orchestrator-deepseek.zip.sha256
          python3 tools/package_platform_skills.py skill copilot github-project-orchestrator-copilot.zip github-project-orchestrator-copilot.zip.sha256

      - name: Publish exact version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish_release.py
