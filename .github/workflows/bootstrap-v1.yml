name: Bootstrap v1 Source

on:
  push:
    branches:
      - bootstrap/v1.0.0
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap-v1.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-v1
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify repository source
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/part-00
          cat bootstrap/part-* | base64 --decode > /tmp/repo-bootstrap.tar.gz
          echo "7828dca47e449a6da66ce3799f10a1394de5ce10ed405ff9f382b7b70948b173  /tmp/repo-bootstrap.tar.gz" | sha256sum -c -
          tar -xzf /tmp/repo-bootstrap.tar.gz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-v1.yml
          python3 tools/validate_skill.py skill
          git status --short

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import v1.0.0 skill baseline"
          git push origin HEAD:bootstrap/v1.0.0
